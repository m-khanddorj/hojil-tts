[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hojil-data"
version = "0.1.0"
description = "Reproducible Khalkha speech data preparation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=16,<27"]
audio = ["imageio-ffmpeg==0.6.0", "soundfile>=0.13,<0.15"]

[project.scripts]
hojil-data = "hojil_data.cli:main"

[tool.setuptools.packages.find]
include = ["hojil_data*"]
